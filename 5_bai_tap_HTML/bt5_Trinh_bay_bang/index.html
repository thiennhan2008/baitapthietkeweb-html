<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thời khóa biểu</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    table { width: 100%; border-collapse: collapse; text-align: center; }
    caption { font-size: 24px; font-weight: bold; margin-bottom: 15px; }
    th, td { border: 1px solid #555; padding: 12px; }
    thead { background: #dbeafe; }
    tbody tr:nth-child(even) { background: #f1f5f9; }
  </style>
</head>
<body>
  <table>
    <caption>THỜI KHÓA BIỂU HẰNG TUẦN</caption>
    <thead>
      <tr>
        <th>Buổi</th>
        <th>Thứ Hai</th>
        <th>Thứ Ba</th>
        <th>Thứ Tư</th>
        <th>Thứ Năm</th>
        <th>Thứ Sáu</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th>Sáng</th>
        <td>Toán</td>
        <td>Lập trình</td>
        <td>Tiếng Anh</td>
        <td>Cơ sở dữ liệu</td>
        <td>Thiết kế web</td>
      </tr>
      <tr>
        <th>Chiều</th>
        <td>Thực hành</td>
        <td>Toán rời rạc</td>
        <td>Tự học</td>
        <td>Lập trình</td>
        <td>Thể chất</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
